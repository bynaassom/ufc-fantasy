<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>UFC Fantasy — offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d0d;color:#f0f0f0;font-family:system-ui,sans-serif}.card{width:min(420px,calc(100% - 32px));border:1px solid #2a2a2a;border-top:4px solid #e8001a;padding:32px;background:#1a1a1a}h1{margin:0 0 12px;font-size:28px;text-transform:uppercase;letter-spacing:.05em}p{margin:0 0 24px;color:#aaa;line-height:1.5}button{border:0;background:#e8001a;color:#fff;padding:12px 18px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sem conexão</h1>
      <p>Seus picks já iniciados ficam protegidos neste aparelho e serão enviados quando a conexão voltar. As páginas e os dados da sua conta não são armazenados offline.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
